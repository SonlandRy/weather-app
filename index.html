<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link 
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title> Weather</title>
</head>
<body>
    <div class="container">
        <div class="search-box">
           
            <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="vertical-align: middle;"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>

            <input type="text" placeholder="Enter your location">
            <button>
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>  
        </div>

        <div class="not-found">
            <img src="images/404.png">
            <p>Oops! Invalid location :</p>
        </div>

        <div class="weather-box">
            <img src="" alt="">
            <p class="temperature"></p>
            <p class="description"></p>
        </div>

        <div class="weather-details">
            <div class="humidity">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="30" height="30" fill="#0652dd"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                <div class="text">
                    <span></span>
                    <p>Humidity</p>
                </div>
            </div>

            <div class="wind">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="30" height="30" fill="#a4b0be"><path d="M2 13h12a3 3 0 0 0 0-6H3v2h11a1 1 0 0 1 0 2H2v2zm0-5h6V6H2v2zm0 10h17a1 1 0 0 1 0 2H2v-2zm0-5h14v-2H2v2z"/></svg>
                <div class="text">
                    <span></span>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>


    </div>

    <script src="https://kit.fontawesome.com/7c8801c017.js" crossorigin="anonymous"> </script>
    <script src="index.js"> </script>
</body>
</html>
